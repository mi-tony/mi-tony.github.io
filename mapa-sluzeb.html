<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI asistent – mapa služeb</title>
<style>
  html,body{margin:0;height:100%;background:#0a0e1a;overflow:hidden;font-family:Inter,"Segoe UI",-apple-system,Roboto,sans-serif;color:#e6e9f2}
  canvas{display:block;touch-action:none;outline:none}
  canvas:focus-visible{box-shadow:inset 0 0 0 2px #7c5cdb}
  button:focus-visible{outline:2px solid #7c5cdb;outline-offset:2px;border-radius:6px}
  .lnk{background:none;border:0;padding:0;color:#9aa3c2;font:inherit;cursor:pointer}
  #panel{position:absolute;top:14px;left:14px;width:236px;background:rgba(14,21,40,.92);border:1px solid rgba(255,255,255,.07);
    border-radius:18px;padding:14px 16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:14px;user-select:none;max-height:calc(100% - 60px);overflow:auto}
  #panel h1{font-size:15px;margin:0 0 10px;font-weight:600;letter-spacing:.2px}
  .row{display:flex;align-items:center;gap:9px;padding:3px 0;cursor:pointer;background:none;border:0;color:inherit;font:inherit;width:100%;text-align:left}
  .cb{width:16px;height:16px;border-radius:5px;background:#7c5cdb;display:flex;align-items:center;justify-content:center;flex:none;box-sizing:border-box}
  .cb.off{background:transparent;border:1.5px solid #4a5475}
  .cb svg{width:11px;height:11px}
  .cb.off svg{display:none}
  .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .muted{color:#7d88a8;font-size:12px}
  .muted a{color:#9aa3c2;cursor:pointer;text-decoration:none}
  #legendCtl{margin:6px 0 10px}
  .btn{display:block;width:100%;background:#2563eb;color:#fff;border:0;border-radius:12px;padding:9px;font-size:14px;font-weight:500;margin:6px 0 10px;cursor:pointer}
  .cb.blue{background:#3b82f6}
  .key{display:flex;align-items:center;gap:8px;margin-top:4px}
  .key svg{flex:none}
  #stats{margin-top:10px}
  #tip{position:absolute;pointer-events:none;background:rgba(14,21,40,.96);border:1px solid rgba(255,255,255,.1);border-radius:12px;
    padding:9px 12px;font-size:13px;max-width:280px;display:none;line-height:1.4}
  #tip b{font-size:14px}
  #tip .g{font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}
  #collapse{position:absolute;top:14px;right:14px;background:rgba(14,21,40,.9);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:7px 11px;font-size:13px;color:#9aa3bf;cursor:pointer}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<canvas id="c" tabindex="0" role="img" aria-label="Síťový graf služeb AI asistenta. Textová verze je v seznamu níže. Šipky posouvají, plus a mínus mění přiblížení, nula vrátí celý pohled."></canvas>
<div id="panel">
  <h1>AI asistent · mapa služeb</h1>
  <div id="legend"></div>
  <div id="legendCtl" class="muted"><button class="lnk" id="all">vše</button> · <button class="lnk" id="none">nic</button></div>
  <button class="btn" id="reheat">⟳ Zatřást grafem</button>
  <button class="row" id="lblToggle" aria-pressed="true"><span class="cb blue"><svg viewBox="0 0 12 12"><path d="M2 6.5l2.5 2.5L10 3" stroke="#fff" stroke-width="2" fill="none"/></svg></span>Popisky hlavních uzlů</button>
  <button class="row" id="allLblToggle" aria-pressed="false"><span class="cb blue off"><svg viewBox="0 0 12 12"><path d="M2 6.5l2.5 2.5L10 3" stroke="#fff" stroke-width="2" fill="none"/></svg></span>Všechny popisky</button>
  <div class="muted key"><svg width="26" height="10" aria-hidden="true"><line x1="0" y1="5" x2="16" y2="5" stroke="#9aa3c2" stroke-dasharray="4 4"/><circle cx="21" cy="5" r="4" fill="#9aa3c2"/><circle cx="21" cy="5" r="1.8" fill="none" stroke="#0e1528" stroke-width="1.2"/></svg>plánované (kroužek)</div>
  <div class="muted key"><svg width="26" height="10" aria-hidden="true"><line x1="0" y1="5" x2="16" y2="5" stroke="#9aa3c2" stroke-dasharray="1 3"/><circle cx="21" cy="5" r="4" fill="none" stroke="#9aa3c2" stroke-width="1.5"/></svg>nepřímé / záložní (obrys)</div>
  <div class="muted" style="margin-top:10px"><span id="stats" aria-live="polite"></span> · <span id="fps" aria-hidden="true"></span></div>
</div>
<button id="collapse" aria-label="Skrýt nebo zobrazit panel">☰</button>
<div id="tip" role="tooltip"></div>
<div id="srlist" class="sr"></div>
<script>
const GROUPS = {
  core:   {name:"Jádro asistenta",     color:"#ffffff"},
  ai:     {name:"AI modely",           color:"#f0905a"},
  kom:    {name:"Komunikace",          color:"#22c3e6"},
  mail:   {name:"Pošta & kalendář",    color:"#e8686a"},
  cloud:  {name:"Cloudové úložiště",   color:"#5fd16a"},
  task:   {name:"Úkolník",             color:"#c9cbe0"},
  infra:  {name:"Server & síť",        color:"#3fb59a"},
  cron:   {name:"Pravidelné úlohy",    color:"#f0a010"},
  proj:   {name:"Projekty",            color:"#9b6fe0"},
  web:    {name:"Web & nástroje",      color:"#e66fb0"},
};
// [id, popisek, skupina, popis, hub?, stav]  stav: "" | "p" (plánované) | "i" (nepřímé / záložní)
const N = [
 ["core","AI asistent","core","Autonomní agent na domácím serveru.",1],
 ["ai","AI modely","ai","Jazykové modely, na kterých asistent běží.",1],
 ["kom","Komunikace","kom","Kanály, kterými se s asistentem mluví.",1],
 ["mail","Pošta & kalendář","mail","Osobní e-mail a kalendář.",1],
 ["cloud","Cloudové úložiště","cloud","Zálohy a výměna souborů.",1],
 ["task","Úkolník","task","Úkoly a projekty – zdroj pravdy.",1],
 ["infra","Server & síť","infra","Domácí mini PC a síť.",1],
 ["cron","Pravidelné úlohy","cron","Co asistent dělá sám podle plánu.",1],
 ["proj","Projekty","proj","Projektové karty.",1],
 ["web","Web & nástroje","web","Vyhledávání a práce s webem.",1],
 // jádro
 ["mem","Paměť","core","Trvalé poznámky a profil uživatele."],
 ["skills","Postupy (skills)","core","Uložené návody pro opakované úlohy."],
 ["appr","Schvalování příkazů","core","Rizikové příkazy schvaluje člověk v chatu."],
 // AI
 ["llm1","Hlavní LLM","ai","Model pro konverzaci a práci."],
 ["llm2","Rychlý LLM","ai","Komprese kontextu, názvy, kontrola na pozadí."],
 ["llm3","LLM pro obrázky","ai","Analýza obrázků a screenshotů."],
 ["llm4","Záložní LLM","ai","Převezme práci při výpadku hlavního modelu.",0,"i"],
 ["img","Generování obrázků","ai","Tvorba obrázků přes záložního poskytovatele."],
 ["stt","Přepis řeči","ai","Lokální převod hlasových zpráv na text."],
 ["llm5","Lokální LLM","ai","Vlastní model na výkonném PC v síti.",0,"p"],
 // komunikace
 ["chat","Chatovací aplikace","kom","Hlavní kanál; přijímá zprávy jen od vlastníka."],
 ["voice","Hlasové zprávy","kom","Chat → přepis řeči → text."],
 ["cli","Terminál (CLI)","kom","Textové rozhraní na serveru."],
 ["ssh","SSH","kom","Vzdálený přístup, jen klíče."],
 ["ssh2","SSH z tabletu","kom","Další zařízení.",0,"p"],
 ["api","Lokální API","kom","HTTP API jen na localhostu, s klíčem."],
 ["files","Soubory do chatu","kom","Obrázky, PDF a audio přímo v chatu."],
 // pošta
 ["email","E-mail","mail","Čtení a třídění pošty; bez práva odesílat."],
 ["cal","Kalendář","mail","Čtení událostí."],
 ["oauth1","Registrace aplikace","mail","OAuth přístup k poště."],
 ["copil","Kancelářský AI asistent","mail","Nepřímo: výstupy z pracovního prostředí předává uživatel.",0,"i"],
 // cloud
 ["st1","Úložiště – zálohy","cloud","Šifrované zálohy serveru."],
 ["st2","Úložiště – pracovní složka","cloud","Sdílená složka pro výměnu souborů."],
 ["fin","Do asistenta","cloud","Vstupní soubory."],
 ["fout","Od asistenta","cloud","Výstupy asistenta."],
 ["farch","Archiv","cloud","Archiv souborů."],
 ["oauth2","OAuth aplikace","cloud","Vlastní přístupová aplikace pro synchronizaci."],
 ["sync","Synchronizace","cloud","Přenos souborů mezi serverem a úložištěm."],
 // úkolník
 ["tasks","Úkoly","task","Seznam úkolů s termíny."],
 ["tproj","Projektové stránky","task","Stránky k projektům."],
 ["ideas","Odložené myšlenky","task","Backlog nápadů."],
 // infra
 ["os","Operační systém","infra","Serverový systém, celý disk k dispozici."],
 ["svc","Správce služeb","infra","Služby samy naběhnou po výpadku proudu."],
 ["fw","Firewall","infra","Příchozí provoz zakázán, výjimky jen LAN a VPN."],
 ["vpn","VPN","infra","Soukromá síť pro vzdálený přístup, HTTPS."],
 ["mon","Monitoring agentů","infra","Přehled běhu, jen z VPN a LAN."],
 ["router","Router / DHCP","infra","Pevná adresa serveru v LAN."],
 ["dns","DNS hosting","infra","Doména a DNS záznamy webu."],
 ["pwd","Správce hesel","infra","Tajemství a klíče k zálohám; asistent nemá přístup.",0,"i"],
 // cron
 ["c1","Ranní plán","cron","Ráno v pracovní dny."],
 ["c2","Polední kontrola","cron","Průběžná kontrola úkolů."],
 ["c3","Odpolední kontrola","cron","Průběžná kontrola úkolů."],
 ["c4","Večerní shrnutí","cron","Shrnutí dne v pracovní dny."],
 ["c5","Připomínka nápadů","cron","Dvakrát týdně z backlogu."],
 ["c6","Záloha serveru","cron","Denně, šifrovaně; hlásí jen chyby."],
 ["c7","Export úkolníku","cron","Měsíčně; hlásí jen chyby."],
 ["c8","Test obnovy záloh","cron","Čtvrtletně: stažení, rozšifrování, kontrolní součet."],
];
for(let i=1;i<=8;i++) N.push(["p"+i,"Projekt "+i,"proj","Projektová karta.",0,i===8?"p":""]);
N.push(
 ["search","Vyhledávání","web","Hledání na webu."],
 ["read","Čtení stránek","web","Text stránek a PDF."],
 ["brow","Prohlížeč","web","Ovládání webu v prohlížeči."],
 ["cms","Web (CMS)","web","Správa obsahu přes API – jen koncepty.",0,"p"],
);
const X = [
 ["llm1","core"],["llm4","core"],["stt","voice"],["voice","chat"],["img","llm4","s"],["llm5","vpn"],["appr","chat"],["skills","mem"],
 ["c1","chat"],["c2","chat"],["c3","chat"],["c4","chat"],["c5","chat"],["c6","chat"],["c7","chat"],["c8","chat"],
 ["c1","cal"],["c1","tasks"],["c2","tasks"],["c3","tasks"],["c4","tasks"],["c5","ideas"],
 ["c6","st1"],["c6","sync"],["c7","task"],["c7","st1"],["c8","st1"],
 ["sync","st1"],["sync","st2"],["oauth2","sync"],["st2","fin"],["st2","fout"],["st2","farch"],
 ["oauth1","email"],["email","copil"],["ssh","fw"],["ssh","vpn"],["mon","vpn"],["vpn","fw"],["router","os"],["svc","chat"],["cli","ssh"],["api","cli"],["files","chat"],["ssh2","ssh"],
 ["pwd","st1"],["pwd","oauth2"],["pwd","cms"],["dns","cms"],
 ["p1","fin"],["p4","p5"],["p7","cms"],["p6","p7"],["p8","fin"],["proj","tasks"],
 ["p1","tproj"],["p2","tproj"],["p3","tproj"],["p4","tproj"],["p5","tproj"],["p6","tproj"],["p7","tproj"],
 ["brow","search"],["read","search"],
];
const STAT_TXT={p:"plán",i:"nepřímé"};

// ---------- data ----------
const nodes=N.map(n=>({id:n[0],label:n[1],g:n[2],desc:n[3],hub:!!n[4],st:n[5]||"",x:0,y:0,vx:0,vy:0}));
const byId={};nodes.forEach(n=>byId[n.id]=n);
const L=[];
nodes.forEach(n=>{ if(n.id==="core")return; if(n.hub||n.g==="core") L.push(["core",n.id]); else L.push([n.g,n.id]); });
X.forEach(x=>{ if(!byId[x[0]]||!byId[x[1]]) console.warn("chybí uzel",x); else L.push(x); });
// 3. prvek vazby: "s" = vynutit plnou čáru (skutečně používaná vazba)
const links=L.map(([a,b,o])=>{const s=byId[a],t=byId[b];return {s,t,st:o==="s"?"":(s.st==="p"||t.st==="p"?"p":(s.st==="i"||t.st==="i"?"i":""))};});

// ---------- seeded random (stabilní rozložení) ----------
let seed=20261103;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}

// ---------- canvas ----------
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
let W,H,DPR=Math.min(window.devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+"px";cv.style.height=H+"px";}
resize();

// ---------- state ----------
let alpha=1, dirty=true;
const hidden=new Set();let showMain=true,showAll=false;let hover=null,drag=null;
const visible=n=>!hidden.has(n.g)||n.id==="core";
function computeRadii(){
  nodes.forEach(n=>n.deg=0);
  links.forEach(l=>{ if(visible(l.s)&&visible(l.t)){l.s.deg++;l.t.deg++;} });
  nodes.forEach(n=>n.r = n.id==="core"?22 : n.hub? 11+Math.sqrt(n.deg)*1.6 : 3.2+Math.sqrt(n.deg)*1.1);
}
computeRadii();

// initial placement (seeded)
const hubs=nodes.filter(n=>n.hub&&n.id!=="core");
hubs.forEach((h,i)=>{const a=i/hubs.length*Math.PI*2;h.x=Math.cos(a)*260;h.y=Math.sin(a)*200;});
nodes.forEach(n=>{ if(n.hub)return; const h= n.g==="core"? byId.core : byId[n.g]; n.x=h.x+(rnd()-.5)*120; n.y=h.y+(rnd()-.5)*120;});

function tick(){
  const k=alpha;
  for(let i=0;i<nodes.length;i++){const a=nodes[i];
    for(let j=i+1;j<nodes.length;j++){const b=nodes[j];
      let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy+0.01;
      const s=(a.hub||b.hub)?2600:900; const f=s/d2*k; const d=Math.sqrt(d2);
      dx/=d;dy/=d;a.vx-=dx*f;a.vy-=dy*f;b.vx+=dx*f;b.vy+=dy*f;}}
  links.forEach(l=>{const a=l.s,b=l.t;let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    const isCore=a.id==="core"||b.id==="core";
    const coreLeaf=isCore&&(a.g==="core"&&!a.hub||b.g==="core"&&!b.hub);
    const same=(a.g===b.g)||(a.id===b.g)||(b.id===a.g);
    const rest = coreLeaf?70 : isCore?210 : same?55 : 170;
    const str = coreLeaf?0.05 : same?0.06 : isCore?0.04 : 0.008;
    const f=(d-rest)*str*k;dx/=d;dy/=d;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f;});
  nodes.forEach(n=>{n.vx-=n.x*0.004*k;n.vy-=n.y*0.004*k;});
  const C=byId.core;C.vx-=C.x*0.05;C.vy-=C.y*0.05;
  nodes.forEach(n=>{ if(n===drag)return; n.vx*=0.82;n.vy*=0.82;n.x+=n.vx;n.y+=n.vy;});
  alpha=Math.max(alpha*0.994,0.02);
}

// ---------- view ----------
let view={x:0,y:0,s:1};
function fit(){let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;nodes.filter(visible).forEach(n=>{minx=Math.min(minx,n.x);maxx=Math.max(maxx,n.x);miny=Math.min(miny,n.y);maxy=Math.max(maxy,n.y);});
  const panelOn=document.getElementById("panel").style.display!=="none";
  const pw=(W>700&&panelOn)?260:0; const s=Math.min((W-pw-80)/Math.max(maxx-minx,1),(H-80)/Math.max(maxy-miny,1),1.6);
  view.s=s;view.x=pw/2+W/2-(minx+maxx)/2*s;view.y=H/2-(miny+maxy)/2*s;dirty=true;}
for(let i=0;i<500;i++)tick();alpha=0.02;
const toScreen=n=>[n.x*view.s+view.x,n.y*view.s+view.y];
function shade(hex){const n=parseInt(hex.slice(1),16);return `rgb(${(n>>16)*.45|0},${(n>>8&255)*.45|0},${(n&255)*.45|0})`;}

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle="#0a0e1a";ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(view.x,view.y);ctx.scale(view.s,view.s);
  const nb=hover?new Set(links.filter(l=>l.s===hover||l.t===hover).flatMap(l=>[l.s,l.t])):null;
  ctx.globalCompositeOperation="lighter";
  links.forEach(l=>{ if(!visible(l.s)||!visible(l.t))return;
    const hl=hover&&(l.s===hover||l.t===hover);
    ctx.strokeStyle= hl? "rgba(230,233,255,0.75)" : `rgba(190,200,235,${hover?0.06:0.24})`;
    ctx.lineWidth=(hl?1.6:1)/Math.sqrt(view.s);
    ctx.setLineDash(l.st==="p"?[4,4]:l.st==="i"?[1.2,3]:[]);
    ctx.beginPath();ctx.moveTo(l.s.x,l.s.y);ctx.lineTo(l.t.x,l.t.y);ctx.stroke();});
  ctx.setLineDash([]);
  nodes.forEach(n=>{ if(!visible(n))return; const c=GROUPS[n.g].color; const dim=nb&&!nb.has(n);
    ctx.globalAlpha=dim?0.25:1;
    if(n.hub){const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r*2.6);g.addColorStop(0,c+"66");g.addColorStop(1,c+"00");
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(n.x,n.y,n.r*2.6,0,7);ctx.fill();}
    ctx.globalCompositeOperation="source-over";
    if(n.hub){const g=ctx.createRadialGradient(n.x-n.r*.35,n.y-n.r*.35,n.r*.1,n.x,n.y,n.r);g.addColorStop(0,"#ffffff");g.addColorStop(.35,c);g.addColorStop(1,shade(c));ctx.fillStyle=g;}
    else ctx.fillStyle=c;
    if(n.st==="i"){ctx.strokeStyle=c;ctx.lineWidth=1.6;ctx.fillStyle="#0a0e1a";ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,7);ctx.fill();ctx.stroke();}
    else{ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,7);ctx.fill();}
    if(n.st==="p"){ctx.strokeStyle="#0a0e1a";ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(n.x,n.y,n.r*0.45,0,7);ctx.stroke();}
    ctx.globalCompositeOperation="lighter";});
  ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over";ctx.restore();
  // labels – vyhýbají se popiskům i uzlům
  ctx.textAlign="center";ctx.textBaseline="bottom";
  const placed=[];
  nodes.forEach(n=>{ if(!visible(n))return; const [sx,sy]=toScreen(n); const r=n.r*view.s; placed.push([sx-r,sy-r,sx+r,sy+r,n]); });
  const hit=(box,self)=>placed.some(b=>b[4]!==self&&box[0]<b[2]&&box[2]>b[0]&&box[1]<b[3]&&box[3]>b[1]);
  nodes.slice().sort((a,b)=>(b.hub-a.hub)||(b.r-a.r)).forEach(n=>{ if(!visible(n))return;
    const show=(n.hub&&showMain)||showAll||n===hover||(nb&&nb.has(n))||view.s>2.2;
    if(!show)return; const [sx,sy]=toScreen(n);
    ctx.font=(n.hub?"600 ":"400 ")+(n.id==="core"?17:n.hub?14:12)+"px Inter,Segoe UI,sans-serif";
    const w=ctx.measureText(n.label).width,h=n.hub?16:13,rr=n.r*view.s;
    const cands=[[sx,sy-rr-4],[sx,sy+rr+h+3],[sx+rr+w/2+5,sy+h/2],[sx-rr-w/2-5,sy+h/2],[sx,sy-rr-h-6],[sx,sy+rr+2*h+5],[sx+rr+w/2+5,sy-h/2-4],[sx-rr-w/2-5,sy-h/2-4]];
    let pos=cands[0];
    for(const c of cands){const box=[c[0]-w/2-2,c[1]-h,c[0]+w/2+2,c[1]]; if(!hit(box,n)){pos=c;break;}}
    placed.push([pos[0]-w/2-2,pos[1]-h,pos[0]+w/2+2,pos[1],n]);
    ctx.shadowColor="#000";ctx.shadowBlur=5;ctx.fillStyle=n.hub?"#f2f4fa":"#c3c8da";
    ctx.fillText(n.label,pos[0],pos[1]);ctx.shadowBlur=0;});
}

// ---------- loop: kreslí jen při změně ----------
let frames=0,fps=0,last=performance.now();
function loop(t){
  const moving=alpha>0.021||drag;
  if(moving){tick();dirty=true;}
  if(dirty){draw();dirty=false;frames++;}
  if(t-last>1000){fps=frames;frames=0;last=t;updStats();}
  requestAnimationFrame(loop);
}
let lastStats="";
function updStats(){const vn=nodes.filter(visible).length;const vl=links.filter(l=>visible(l.s)&&visible(l.t)).length;
  const t=`${vn} uzlů · ${vl} vazeb`; if(t!==lastStats){document.getElementById("stats").textContent=t;lastStats=t;}
  document.getElementById("fps").textContent=fps?fps+" fps":"v klidu";}
fit();updStats();requestAnimationFrame(loop);
addEventListener("resize",()=>{resize();fit();});

// ---------- textová verze pro čtečky ----------
(function(){let h="<h2>Seznam služeb</h2>";Object.entries(GROUPS).forEach(([k,g])=>{
  h+=`<h3>${g.name}</h3><ul>`+nodes.filter(n=>n.g===k).map(n=>{
    const nb=links.filter(l=>l.s===n||l.t===n).map(l=>(l.s===n?l.t:l.s).label);
    return `<li>${n.label}${n.st?" ("+STAT_TXT[n.st]+")":""}: ${n.desc} Vazby: ${nb.join(", ")}.</li>`;}).join("")+"</ul>";});
  document.getElementById("srlist").innerHTML=h;})();

// ---------- legenda ----------
const lg=document.getElementById("legend");
const check='<svg viewBox="0 0 12 12"><path d="M2 6.5l2.5 2.5L10 3" stroke="#fff" stroke-width="2" fill="none"/></svg>';
function setHidden(k,h){h?hidden.add(k):hidden.delete(k);const r=lg.querySelector(`[data-k="${k}"]`);r.firstChild.classList.toggle("off",h);r.setAttribute("aria-pressed",!h);}
function changed(){computeRadii();updStats();dirty=true;}
Object.entries(GROUPS).forEach(([k,g])=>{ if(k==="core")return;
  const r=document.createElement("button");r.className="row";r.dataset.k=k;r.setAttribute("aria-pressed","true");
  r.innerHTML=`<span class="cb">${check}</span><span class="dot" style="background:${g.color}"></span>${g.name}`;
  r.onclick=()=>{setHidden(k,!hidden.has(k));changed();};lg.appendChild(r);});
document.getElementById("all").onclick=()=>{Object.keys(GROUPS).forEach(k=>k!=="core"&&setHidden(k,false));changed();};
document.getElementById("none").onclick=()=>{Object.keys(GROUPS).forEach(k=>k!=="core"&&setHidden(k,true));changed();};
document.getElementById("lblToggle").onclick=e=>{showMain=!showMain;e.currentTarget.firstChild.classList.toggle("off",!showMain);e.currentTarget.setAttribute("aria-pressed",showMain);dirty=true;};
document.getElementById("allLblToggle").onclick=e=>{showAll=!showAll;e.currentTarget.firstChild.classList.toggle("off",!showAll);e.currentTarget.setAttribute("aria-pressed",showAll);dirty=true;};
document.getElementById("reheat").onclick=()=>{nodes.forEach(n=>{n.vx+=(rnd()-.5)*30;n.vy+=(rnd()-.5)*30;});alpha=0.6;};
document.getElementById("collapse").onclick=()=>{const p=document.getElementById("panel");p.style.display=p.style.display==="none"?"":"none";};
if(W<700){document.getElementById("panel").style.display="none";fit();}

// ---------- interakce ----------
const tip=document.getElementById("tip");let tipTimer=null;
function pick(mx,my){let best=null,bd=1e9;nodes.forEach(n=>{if(!visible(n))return;const[sx,sy]=toScreen(n);const d=Math.hypot(sx-mx,sy-my);const r=Math.max(n.r*view.s,12);if(d<r&&d<bd){bd=d;best=n;}});return best;}
function showTip(n,mx,my){ clearTimeout(tipTimer); if(!n){tip.style.display="none";return;} const g=GROUPS[n.g];
  tip.innerHTML=`<div class="g" style="color:${g.color}">${g.name}${n.st?" · "+STAT_TXT[n.st]:""}</div><b>${n.label}</b><br>${n.desc}`;
  tip.style.display="block";tip.style.left=Math.max(8,Math.min(mx+14,W-tip.offsetWidth-8))+"px";tip.style.top=Math.max(8,Math.min(my+14,H-tip.offsetHeight-8))+"px";}
let panning=null,pointers=new Map(),pinch=null;
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);
  if(pointers.size===2){const p=[...pointers.values()];pinch={d:Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]),s:view.s,x:view.x,y:view.y,cx:(p[0][0]+p[1][0])/2,cy:(p[0][1]+p[1][1])/2};drag=null;panning=null;return;}
  const n=pick(e.clientX,e.clientY);hover=n;showTip(n,e.clientX,e.clientY);dirty=true;
  if(n){drag=n;alpha=Math.max(alpha,0.3);}else panning={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};});
cv.addEventListener("pointermove",e=>{ if(pointers.has(e.pointerId))pointers.set(e.pointerId,[e.clientX,e.clientY]);
  if(pinch&&pointers.size===2){const p=[...pointers.values()];const d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);const s=Math.max(.2,Math.min(6,pinch.s*d/pinch.d));
    view.x=pinch.cx-(pinch.cx-pinch.x)*s/pinch.s;view.y=pinch.cy-(pinch.cy-pinch.y)*s/pinch.s;view.s=s;dirty=true;return;}
  if(drag){drag.x=(e.clientX-view.x)/view.s;drag.y=(e.clientY-view.y)/view.s;drag.vx=drag.vy=0;alpha=Math.max(alpha,0.3);showTip(drag,e.clientX,e.clientY);return;}
  if(panning){view.x=panning.vx+e.clientX-panning.x;view.y=panning.vy+e.clientY-panning.y;dirty=true;return;}
  if(e.pointerType==="mouse"){const h=pick(e.clientX,e.clientY);if(h!==hover){hover=h;dirty=true;}cv.style.cursor=hover?"pointer":"default";showTip(hover,e.clientX,e.clientY);}});
function up(e){pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;drag=null;panning=null;
  if(e.pointerType!=="mouse"){clearTimeout(tipTimer);tipTimer=setTimeout(()=>{tip.style.display="none";hover=null;dirty=true;},2500);}}
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
cv.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse"){hover=null;showTip(null);dirty=true;}});
function zoomAt(f,cx,cy){const s=Math.max(.2,Math.min(6,view.s*f));view.x=cx-(cx-view.x)*s/view.s;view.y=cy-(cy-view.y)*s/view.s;view.s=s;dirty=true;}
cv.addEventListener("wheel",e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*0.0015),e.clientX,e.clientY);},{passive:false});
cv.addEventListener("dblclick",()=>fit());
cv.addEventListener("keydown",e=>{const st=40;
  if(e.key==="ArrowLeft")view.x+=st; else if(e.key==="ArrowRight")view.x-=st; else if(e.key==="ArrowUp")view.y+=st; else if(e.key==="ArrowDown")view.y-=st;
  else if(e.key==="+"||e.key==="=")zoomAt(1.2,W/2,H/2); else if(e.key==="-")zoomAt(1/1.2,W/2,H/2); else if(e.key==="0")fit(); else return;
  e.preventDefault();dirty=true;});
</script>
</body>
</html>
